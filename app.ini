; =============================================================================
; IOSTAR-PM 설정 파일 (app.ini)
;  - 제품(국내판/Standard/Neo)마다 다른 값만 이 파일에 둡니다.
;  - 배치 파일(run_server.bat 등), DB 서버(wbs_db_server.py), 화면(js/app-config.js)이 함께 읽습니다.
;  - 형식: 키=값 (등호 앞뒤에 공백 없이), ; 로 시작하는 줄은 설명
;  - 서버 실행 옵션(--port 등)을 주면 이 파일의 값보다 우선합니다.
; =============================================================================
[app]
; 제품 이름 / 판(KR=국내판, STANDARD=Standard, NEO=Neo) / 버전
;  edition_name: 화면·배포 파일·서버 창에 표시하는 판 이름
product_name=IOSTAR-PM
edition=NEO
edition_name=Neo
version=2.2.0
; 처음 화면(로그인 화면)의 언어: ko(한국어) / en(English) — 로그인 후에는 사용자별 언어 적용
default_lang=ko

[server]
; DB 서버 주소·포트
host=0.0.0.0
port=8080
; data 폴더 안의 SQLite DB 파일 이름
db_file=wbs_enterprise.db
; 날짜별 로그 폴더
log_dir=logs
; HTTPS 인증서 (두 파일이 모두 있으면 자동으로 HTTPS 로 기동, make_cert.bat 으로 생성)
cert_file=certs/server.crt
key_file=certs/server.key
