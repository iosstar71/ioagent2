; =============================================================================
; IOSTAR-PM 설정 파일 (app.ini)
;  - 제품(국내판/Standard/Neo)마다 다른 값만 이 파일에 둡니다.
;  - 배치 파일(run_server.bat 등), DB 서버(server/settings.py), 화면(webapp/static/js/config/app-config.js)이 함께 읽습니다.
;  - 형식: 키=값 (등호 앞뒤에 공백 없이), ; 로 시작하는 줄은 설명
;  - 서버 실행 옵션(--port 등)을 주면 이 파일의 값보다 우선합니다.
; =============================================================================
[app]
; 제품 이름 / 판 / 버전
;  브랜드 IOSTAR-PM · 판: STANDALONE(DB · 서버 없음, 브랜치 iostar-pm-standalone) / WORKGROUP(서버 DB, 폐쇄망 100명 규모, 이 브랜치)
;        / ENTERPRISE(전사, 예정 — docs/ENTERPRISE_ROADMAP.md)
;           MAIN=통합판(v4.1.0 에서 분기) / KR=국내판(종료) / STANDARD·NEO=이전 분리판
;  edition_name: 화면·배포 파일·서버 창에 표시하는 판 이름 (통합판은 비워 둠)
product_name=IOSTAR-PM
; 사내 메뉴 · 화면에 보이는 이름
display_name=PM Hub
edition=WORKGROUP
edition_name=Workgroup
; [Workgroup] 최종 확정 전까지는 0.x 로 올림 (1.0.0 = 첫 확정판)
version=0.5.2
; 처음 화면(로그인 화면)의 언어: ko(한국어) / en(English) — 로그인 후에는 사용자별 언어 적용
default_lang=ko

[features]
; [Workgroup 0.1] 기능 켜고 끄기 — 1=사용 / 0=끔 (끈 기능도 코드는 그대로 두고 화면에서 비활성 · "Enterprise" 표시)
;  Workgroup 판은 화면이 일정 시간마다 서버에 묻는 기능을 쓰지 않습니다 (사용자가 무언가를 할 때만 통신)
; 실시간 채팅 (2.5초마다 서버 확인) — 끄면 로컬 저장소 방식처럼 채팅 화면이 잠김
chat=0
; 서버 연결 감시 (20초마다 확인) — 끄면 저장 · 불러오기가 실패할 때 연결 끊김을 알림
server_heartbeat=0
; DB 연동 화면의 Oracle · Excel/Access 선택지 (이 판에서는 동작하지 않음 — Enterprise 예정)
db_oracle=0
db_excel_access=0
; 예전 로컬 파일 직접 연결 동기화 (File System Access)
local_file_sync=0

[lock]
; [Workgroup 0.1] 서브시스템 체크아웃 · 체크인 (DB 서버 방식)
;  required = 체크아웃해야 저장 / advisory = 잠금 없이도 저장 (다른 사람이 체크아웃한 서브시스템은 항상 저장 불가) / off = 사용 안 함
lock_mode=required
; 체크아웃 유효 시간(시간) — 저장 · 새로고침 등 활동할 때마다 다시 이 시간만큼 연장, 지나면 다른 사람이 체크아웃할 수 있음
lock_hours=4

[ui]
; (v3.0.0 부터 화면은 Neo 하나 — 화면 방식 선택 없음)
; 처음 테마: electric(기본) / navy / green / brown / matte(무광) / dark(Graphite, 어두운 화면) — 이미 테마를 고른 프로젝트는 그 테마 유지
default_theme=urban-slate

[security]
; 로그인 화면 [🔄 비밀번호 초기화]: 1=사용(테스트 버전 — 별도 인증 없이 사번만으로 1234 로 초기화) / 0=끔
;  운영 환경에서는 반드시 0 으로 두세요 (누구나 다른 사람의 비밀번호를 초기화할 수 있음)
self_password_reset=1

[server]
; DB 서버 주소·포트
host=0.0.0.0
port=8080
; data 폴더 안의 SQLite DB 파일 이름
db_file=wbs_enterprise.db
; 날짜별 로그 폴더
log_dir=logs
; HTTPS 인증서 (두 파일이 모두 있으면 자동으로 HTTPS 로 기동, make_cert.bat 으로 생성)
cert_file=certs/server.crt
key_file=certs/server.key

[files]
; 첨부파일 (산출물 · 공지 · 게시물 · 회의록의 📎) — DB 서버 방식에서만 사용
;  저장 폴더: 프로그램 폴더 기준 (웹 루트 webapp 밖). 백업할 때 data 폴더와 함께 복사하세요.
upload_dir=upload
; 파일 1개 최대 크기(MB) / 프로젝트별 합계 한도(MB)
max_file_mb=20
; 공지 · 게시물 · 회의록 1건에 붙일 수 있는 파일 수 (산출물은 제한 없음)
max_files_per_post=5
project_quota_mb=5120
; 올릴 수 있는 확장자 (공백으로 구분) — 실행 파일 · 스크립트는 확장자를 바꿔도 내용으로 거부
allowed_extensions=pdf hwp hwpx doc docx xls xlsx ppt pptx txt csv md png jpg jpeg gif bmp webp zip 7z
; 삭제한 파일을 휴지통에 두는 기간(일) — 지나면 자동으로 완전 삭제 / 같은 이름 파일의 보관 버전 수
trash_days=30
keep_versions=10
