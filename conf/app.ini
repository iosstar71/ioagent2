; =============================================================================
; Project Mgmt (협업) Local — 빌드 설정 (배포 묶음에는 들어가지 않음)
;  python tools/app_config.py 로 static/js/config/app-config.js 를 만듭니다.
; =============================================================================
[app]
product_name=Project Mgmt
edition=LOCAL
edition_name=협업
; 화면에 "Local" 로 표시 (서버 없이 브라우저에 저장하는 판)
variant=Local
version=1.0.0
default_lang=ko
; 전사 시스템 안의 하위 주소 (배포 폴더 이름) — https://xxx.com/pprjmgmt/
base_path=/pprjmgmt

[ui]
default_theme=electric
