; =============================================================================
; PM Hub (IOSTAR-PM Standalone) — 빌드 설정 (배포 묶음에는 들어가지 않음)
;  python tools/app_config.py 로 static/js/config/app-config.js 를 만듭니다.
; =============================================================================
[app]
; 제품 브랜드 (로고 · 배포 파일 이름)
brand=IOSTAR-PM
; 사내 메뉴 · 화면에 보이는 이름
display_name=PM Hub
; 판: Standalone(DB · 서버 없음) / Workgroup(서버 DB) / Enterprise(전사)
edition=STANDALONE
edition_name=Standalone
version=1.0.0
default_lang=ko
; 전사 시스템 안의 하위 주소 (배포 폴더 이름) — https://xxx.com/pprjmgmt/
base_path=/pprjmgmt

[ui]
default_theme=urban-slate
