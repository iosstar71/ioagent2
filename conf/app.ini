; =============================================================================
; Project Mgmt (협업) 설정 파일 — 서버와 화면이 함께 읽습니다.
;  - 형식: 키=값, ; 로 시작하는 줄은 설명
;  - 서버 실행 옵션(--port 등)을 주면 이 파일의 값보다 우선합니다.
; =============================================================================
[app]
product_name=Project Mgmt
edition=COLLAB
edition_name=협업
version=1.0.0
; 작업자 선택 화면의 처음 언어: ko / en
default_lang=ko

[ui]
; 처음 테마: electric / navy / green / brown / matte / dark
default_theme=electric

[server]
; 전사 시스템 안의 하위 주소 — https://xxx.com/pprjmgmt/ 로 열 때 /pprjmgmt
;  전사 웹 서버(리버스 프록시)가 /pprjmgmt/ 아래 요청을 이 서버로 넘겨 주면 됩니다 (앞부분을 떼고 넘겨도 동작)
base_path=/pprjmgmt
host=0.0.0.0
port=8080
; data 폴더 안의 SQLite DB 파일 이름
db_file=pprjmgmt.db

[lock]
; 서브시스템 체크아웃 · 체크인
;  required = 체크아웃해야 저장 / advisory = 남이 체크아웃한 것만 막음 / off = 사용 안 함
lock_mode=required
; 체크아웃 유효 시간(시간) — 저장 · 불러오기 등 활동할 때마다 다시 연장
lock_hours=4
