
    <!-- ======<!-- =================================================================== -->
    <!-- 8. 파일 Merge (tab-merge)                                   -->
    <!-- =================================================================== -->
    <!-- 1. 종합대시보드 (tab-dashboard)                                      -->
    <!-- =================================================================== -->
    <!-- =================================================================== -->
    <!-- 🏠 프로젝트 통합 맞춤형 홈 화면   -->
    <!-- 🏛️ 2. 이그제큐티브 브리핑 룸 / 🚀 3. 하이브리드 스마트 포털         -->
    <!-- =================================================================== -->
    <div id="tab-mywork" class="tab-pane">
      <div class="sub-header-bar">
        <div class="u-flex u-ai-center u-gap-12 u-wrap">
          <span class="sub-title">🙋 My Work</span><span class="neo-ph-desc">내가 체크할 일과 내 담당 Task 를 한곳에 모았습니다.</span>
          <span class="home-style-count" id="homeTodoCount" hidden></span>
        </div>
      </div>
      <div class="mw-hello" id="mwHello" hidden></div>
      <div id="homeTodoContainer" style="display:block;"></div>
      <div id="homePortalContainer" style="display:block;">
        <!-- 상단 환영 & 미완료 Task 퀵 요약 배너 -->
        <div class="card u-mb-14" style="background:#f8fafc; border-left:4px solid var(--primary); padding:16px 20px;">
          <div class="u-flex u-jc-between u-ai-center u-wrap u-gap-12">
            <div>
              <h3 style="margin:0 0 4px 0; font-size:var(--fs-lg, 16px); font-weight:800; color:#1e293b;">
                📋 내 담당 Task
              </h3>
            </div>
            <div class="u-flex u-ai-center u-gap-8">
              <label class="u-bold u-fs-sm" style="color:#334155;">서브시스템 필터:</label>
              <select class="u-bold u-r-4 u-fs-sm" id="portalTaskFilterSubsystem" data-change="HomeScreenManager.renderPortal" style="padding:4px 10px; border:1px solid #cbd5e1;">
                <option value="ALL">전체 서브시스템</option>
              </select>
            </div>
          </div>
        </div>

        <!-- 핵심 워크벤치 2단 그리드: 좌측(내 Task & 완료버튼) / 우측(요약카드 & 공지/소통) -->
        <div class="u-grid u-gap-14 u-mb-14" style="grid-template-columns: 1.35fr 1fr;">
          <!-- 좌측: 내 담당 미완료 Task 목록과 원클릭 ✓ 100% 완료 처리 버튼 -->
          <div class="card u-mb-0">
            <div class="card-title">
              <span class="u-bold u-pointer" data-click="switchTab" data-click-args='["tab-wbs"]' title="WBS 공정표 탭으로 이동">📋 진행중 및 미완료 Task 목록 (원클릭 실적 반영)</span>
              <span id="portalTaskCountBadge" class="status-badge-chip chip-progress" style="font-size:var(--fs-2xs, 10px);">0건 대상</span>
            </div>
            <div class="table-container" style="max-height:420px; overflow-y:auto;">
              <table class="matrix-table" id="portalTasksTable">
                <thead>
                  <tr>
                    <th style="width:75px;">서브시스템</th>
                    <th style="width:75px;">WBS ID</th>
                    <th>Task명칭</th>
                    <th style="width:145px;">계획 일정</th>
                    <th style="width:70px;">실적(%)</th>
                    <th style="width:65px;">상태</th>
                    <th class="u-tc" style="width:95px;">실적 등록</th>
                  </tr>
                </thead>
                <tbody id="portalTasksTableBody"></tbody>
              </table>
            </div>
          </div>

          <!-- 우측: 3대 업무 요약 카드 + 공지 & 게시판 -->
          <div class="u-flex u-col u-gap-14">
            <!-- 3대 업무 요약 카드 (요구사항, 산출물, VOC) -->
            <div class="u-grid u-gap-10" style="grid-template-columns:repeat(3, 1fr);">
              <div class="u-r-6 u-p-12 u-tc u-pointer" data-click="switchTab" data-click-args='["tab-req"]' style="background:#f0fdf4; border:1px solid #bbf7d0; transition:transform 0.15s, box-shadow 0.15s;" data-hover-lift="1" title="요구사항(REQ) 탭으로 바로 이동">
                <div class="u-fs-xs u-bold" style="color:#166534;">🎯 요구사항(REQ)</div>
                <div id="portalReqStatValue" style="font-size:var(--fs-xl, 18px); font-weight:800; color:#15803d; margin:4px 0;">0/0건</div>
                <div id="portalReqStatSub" style="font-size:var(--fs-2xs, 10px); color:#166534;">완료율 0%</div>
              </div>
              <div class="u-bd u-r-6 u-p-12 u-tc u-pointer" data-click="switchTab" data-click-args='["tab-deliverables"]' style="background:var(--tint-info); transition:transform 0.15s, box-shadow 0.15s;" data-hover-lift="1" title="산출물 관리 탭으로 바로 이동">
                <div class="u-fs-xs u-bold u-c-info">📑 산출물 승인</div>
                <div class="u-c-info" id="portalDelivStatValue" style="font-size:var(--fs-xl, 18px); font-weight:800; margin:4px 0;">0/0건</div>
                <div class="u-c-info" id="portalDelivStatSub" style="font-size:var(--fs-2xs, 10px);">승인율 0%</div>
              </div>
              <div class="u-r-6 u-p-12 u-tc u-pointer" data-click="switchTab" data-click-args='["tab-voc"]' style="background:#fffbeb; border:1px solid #fef3c7; transition:transform 0.15s, box-shadow 0.15s;" data-hover-lift="1" title="현장 VOC 관리 탭으로 바로 이동">
                <div class="u-fs-xs u-bold" style="color:#92400e;">💬 현장 VOC</div>
                <div id="portalVocStatValue" style="font-size:var(--fs-xl, 18px); font-weight:800; color:#b45309; margin:4px 0;">0/0건</div>
                <div id="portalVocStatSub" style="font-size:var(--fs-2xs, 10px); color:#92400e;">조치율 0%</div>
              </div>
            </div>

            <!-- 주요 공지 카드 -->
            <div class="card u-mb-0">
              <div class="card-title">
                <span class="u-bold u-pointer" data-click="UiH.goNotice" data-click-args='["NOTICES"]' title="공지 탭으로 이동">📢 프로젝트 주요 공지</span>
                <button class="btn btn-outline btn-xs" data-click="UiH.goNotice" data-click-args='["NOTICES"]'>공지 전체보기</button>
              </div>
              <div class="u-col u-gap-8" id="portalNoticesList" style="display:flex; max-height:140px; overflow-y:auto;"></div>
            </div>

            <!-- 실시간 팀 게시판 및 퀵 메시지 작성 -->
            <div class="card u-mb-0 u-flex1">
              <div class="card-title">
                <span class="u-bold u-pointer" data-click="UiH.goNotice" data-click-args='["FEED"]' title="게시판 탭으로 이동">💬 실시간 팀 게시판</span>
                <button class="btn btn-outline btn-xs" data-click="UiH.goNotice" data-click-args='["FEED"]'>소통센터 이동</button>
              </div>
              <div class="u-r-4 u-p-8 u-fs-xs u-mb-8" id="portalChatStream" style="height:110px; overflow-y:auto; background:#f8fafc; border:1px solid #e2e8f0;"></div>
              <div class="u-flex u-gap-6">
                <input class="u-flex1 u-fs-xs u-r-4" type="text" id="portalChatInput" placeholder="팀원에게 빠른 메시지 전송..." style="padding:5px 8px; border:1px solid #cbd5e1;" data-keypress="HomeScreenManager.sendQuickMessage" data-keypress-key="Enter">
                <button class="btn btn-primary btn-sm" data-click="HomeScreenManager.sendQuickMessage" style="padding:4px 10px;">전송</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
