
    <!-- =================================================================== -->
    <!-- 6. 추가 VOC / 이슈관리 (tab-voc) - [요건 6] 서브시스템 필터 & 선택   -->
    <!-- =================================================================== -->
    <div id="tab-voc" class="tab-pane">
      <div class="sub-header-bar">
        <div class="u-flex u-ai-center u-gap-10">
          <span class="sub-title">📣 VOC · 이슈</span><span class="neo-ph-desc">진행 중에 새로 들어온 요청과 문제를 접수해 해결까지 챙깁니다.</span>
          <div class="current-date-badge">기준일: <b class="lbl-current-date">2026-11-04 (수)</b></div>
        </div>
        <div class="u-flex u-gap-8 u-ai-center">
          
          <button class="btn btn-sm" data-btn="excel-down" data-click="DataIO.download" data-click-args='["voc"]' title="이 화면의 서브시스템 조회 범위 그대로 엑셀로 다운로드합니다">📥 엑셀 다운로드 (VOC)</button>
          <button class="btn btn-sm" data-btn="excel-up" data-click="DataIO.pick" data-click-args='["voc"]' title="같은 양식의 엑셀을 이 화면의 서브시스템 조회 범위에 반영합니다 (반영 전 확인 · 자동 백업)">📤 엑셀 업로드 (VOC)</button>
          <button class="btn btn-primary btn-sm" data-click="addNewVoc">+ VOC 등록</button>
        </div>
      </div>

      <!-- VOC 서브시스템 필터 및 상태 통계 바 -->
      <div class="filter-toolbar">
        <div class="filter-item">
          <label class="u-bold">🗂️ 도메인별 조회:</label>
          <select class="u-bold" id="vocDomainFilter" data-change="UiH.domainFilter" data-change-args='["vocDomainFilter", "vocSubsystemFilter", "renderVocTable"]'></select>
        </div>
        <div class="filter-item">
          <label class="u-bold">🏢 서브시스템별 조회:</label>
          <select id="vocSubsystemFilter" data-change="renderVocTable">
            <option value="ALL">전체 서브시스템 보기</option>
          </select>
        </div>
        <div class="filter-item">
          <label class="u-bold">🏷️ 구분:</label>
          <select id="vocTypeFilter" data-change="renderVocTable" title="VOC: 고객 개선 요청 · 버그: 수정 요청 · 이슈: 고객 · 내부 문제 제기">
            <option value="ALL">전체</option><option value="VOC">VOC</option><option value="버그">버그</option><option value="이슈">이슈</option>
          </select>
        </div>
        <div class="filter-item"><span class="neo-chips" id="vocStatusChips" role="group" aria-label="상태 필터"></span></div>
        <div class="status-summary-bar u-mb-0 u-ai-center" style="margin-left:auto;">
          <span class="status-badge-chip chip-total">전체: <b id="tab-voc-stat-total">0</b></span>
          <span class="status-badge-chip chip-ready">대기: <b id="tab-voc-stat-ready">0</b></span>
          <span class="status-badge-chip chip-progress">진행: <b id="tab-voc-stat-progress">0</b></span>
          <span class="status-badge-chip chip-completed">완료: <b id="tab-voc-stat-completed">0</b></span>
          <span class="status-badge-chip chip-excluded">제외: <b id="tab-voc-stat-excluded">0</b></span>
          <span class="status-badge-chip chip-hold">보류: <b id="tab-voc-stat-hold">0</b></span>
          <span class="status-badge-chip chip-del">삭제: <b id="tab-voc-stat-deleted">0</b></span>
          <span class="u-fs-sm u-bold u-c-success u-ml-6">
            달성률: <span id="tab-voc-stat-rate">0.0%</span>
          </span>
        </div>
      </div>

      <div class="table-container" style="max-height: 600px;">
        <table id="vocTable">
          <thead>
            <tr>
              <th style="width: 90px;">VOC ID</th>
              <th style="width: 76px;" title="VOC: 고객 개선 요청 · 버그: 수정 요청 · 이슈: 고객 · 내부 문제 제기">구분</th>
              <th style="width: 135px;">서브시스템</th>
              <th style="width: 80px;">우선순위</th>
              <th style="min-width: 240px;">요청 제목 / 이슈 내용</th>
              <th style="width: 90px;">요청자</th>
              <th style="width: 145px;">접수일자</th>
              <th style="width: 145px;">목표완료일</th>
              <th style="width: 105px;">처리상태</th>
              <th style="min-width: 180px;">처리결과 및 조치계획</th>
              <th style="width: 45px;">삭제</th>
            </tr>
          </thead>
          <tbody id="vocTableBody"></tbody>
        </table>
      </div>
    </div>
