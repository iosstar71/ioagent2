
    <!-- =================================================================== -->
    <!-- 4. WBS (tab-wbs) - [요건 5] 전면 개선                      -->
    <!-- =================================================================== -->
    <div id="tab-wbs" class="tab-pane">
      <div class="sub-header-bar">
        <div class="u-flex u-ai-center u-gap-10">
          <span class="sub-title">📋 WBS</span><span class="neo-ph-desc">해야 할 일을 단계별로 나누고 일정 · 담당자 · 실적을 입력합니다.</span>
        </div>
        <div class="u-flex u-gap-6 u-ai-center u-wrap">
          <div class="current-date-badge">기준일: <b class="lbl-current-date">2026-11-04 (수)</b></div>
          <!-- [요건 5] 서브시스템별 템플릿 추가 버튼 WBS 탭으로 이동 -->
          <button class="btn btn-primary btn-sm" data-click="WbsTemplate.open">📋 서브시스템별 템플릿 추가 · 복사</button>
          
          <button class="btn btn-sm" data-btn="excel-down" data-click="DataIO.download" data-click-args='["wbs"]' title="이 화면의 서브시스템 조회 범위 그대로 엑셀로 다운로드합니다">📥 엑셀 다운로드 (WBS)</button>
          <button class="btn btn-sm" data-btn="excel-up" data-click="DataIO.pick" data-click-args='["wbs"]' title="같은 양식의 엑셀을 이 화면의 서브시스템 조회 범위에 반영합니다 (반영 전 확인 · 자동 백업)">📤 엑셀 업로드 (WBS)</button>
          <button class="btn btn-primary btn-sm" data-click="addNewRow">+ Task 추가</button>
          <button class="btn btn-success btn-sm" data-click="UiH.rebuildToast" data-click-args='["WBS 재정렬, 기간검증 및 롤업이 완료되었습니다."]'>📐 다시 계산</button>
        </div>
      </div>

      <!-- [요건 5] WBS 조회 필터(서브시스템별, 레벨단위 접기) 및 일괄 보정 툴바 -->
      <div class="filter-toolbar">
        <div class="filter-item">
          <label class="u-bold">📶 단계별 조회:</label>
          <select class="u-bold" id="wbsPhaseFilter" data-change="renderWbsTable" title="SDLC · 개선 공정 단계로 걸러 봅니다 (단계에 해당하는 Task 와 그 상위 Task 표시)">
            <option value="ALL">전체 단계</option>
          </select>
        </div>
        <div class="filter-item">
          <label class="u-bold">🗂️ 도메인별 조회:</label>
          <select class="u-bold" id="wbsDomainFilter" data-change="UiH.domainFilter" data-change-args='["wbsDomainFilter", "wbsSubsystemFilter", "renderWbsTable"]'></select>
        </div>
        <div class="filter-item">
          <label class="u-bold">🏢 서브시스템 조회:</label>
          <select id="wbsSubsystemFilter" data-change="renderWbsTable">
            <option value="ALL">전체 서브시스템 보기</option>
          </select>
        </div>
        <div class="filter-item">
          <label class="u-bold">📂 레벨 보기:</label>
          <select id="wbsMaxLevelFilter" data-change="renderWbsTable">
            <option value="5">전체 레벨 표시 (L1 ~ L5)</option>
            <option value="4">L4까지만 표시 (L5 이하 숨김)</option>
            <option value="3">L3까지만 표시 (L4 이하 숨김)</option>
            <option value="2">L2까지만 표시 (L3 이하 숨김)</option>
            <option value="1">L1(서브시스템)만 표시 (L2 이하 숨김)</option>
          </select>
        </div>
        <div class="filter-item">
          <label class="u-bold">🚦 상태 조회 (최하위 Task):</label>
          <select id="wbsStatusFilter" class="neo-std-only" data-change="renderWbsTable" title="상태를 고르면 그 상태의 최하위 Task 와, 레벨 보기에서 고른 레벨까지의 상위 Task 를 묶음 머리로 함께 표시합니다.">
            <option value="ALL">전체 (계층 표시)</option>
            <option value="지연">🔴 지연 Task만</option>
            <option value="진행중">🔵 진행중 Task만</option>
            <option value="대기">⚪ 대기 Task만</option>
            <option value="완료">🟢 완료 Task만</option>
            <option value="선행 지연">⛓ 선행 지연 Task만</option>
          </select>
          <span class="status-badge-chip chip-delayed neo-std-only u-pointer" data-click="UiH.setValueRun" data-click-args='["wbsStatusFilter", "지연", "renderWbsTable"]' title="지연 최하위 Task 조회">지연 <b id="wbsDelayedCount">0</b>건</span>
          <!-- [Neo 2.1] 상태 칩 필터 (최하위 Task 상태별 건수, 누르면 해당 상태만 표시) -->
          <span class="neo-chips" id="neoStatusChips" role="group" aria-label="상태 필터"></span>
          <span class="wbs-err-group" id="wbsErrGroup" style="display:none;" title="오류 칸은 표에서 같은 색으로 표시됩니다">
            <span class="wbs-err-label">⚠️ 오류</span>
            <span id="wbsWeightErrChip" class="wbs-err-chip" style="display:none;" title="하위 가중치 합이 상위와 다른 묶음"></span>
            <span id="wbsHolidayErrChip" class="wbs-err-chip" style="display:none;" title="계획시작 · 종료일이 주말 · 공휴일인 Task"></span>
            <span id="wbsDateErrChip" class="wbs-err-chip" style="display:none;" title="시작일이 종료일보다 늦거나 프로젝트 기간을 벗어난 Task"></span>
          </span>
        </div>
        <div class="u-flex u-gap-6 u-wrap u-ml-auto">
          <button type="button" class="btn btn-sm wbs-fold-btn" id="btnWbsFold" data-click="WbsFold.toggle" title="가중치 · REQ ID · 담당자 · 산출물 칸을 접어 표 전체를 한 화면에 봅니다">◀ 가중치·REQ·담당자·산출물 접기</button>
          <button class="btn btn-secondary btn-sm" data-click="WbsWeight.runFix" title="경고가 난 묶음만 하위 가중치를 계획 기간(일수) 비율로 다시 나눕니다 (서브시스템 100 기준, 소수점 1자리). 지금 조회한 서브시스템만 대상">⚖️ 가중치 맞추기</button>
          <button class="btn btn-secondary btn-sm" data-click="autoAdjustWbsHolidays" title="계획시작일/종료일이 주말 또는 공휴일인 경우 가장 가까운 평일(영업일)로 자동 보정합니다.">
            🗓️ 휴일 날짜 옮기기
          </button>
          <button class="btn btn-warning btn-sm" data-click="fillActualFromPlan" title="선택한 서브시스템(또는 전체)에서 계획 진척률이 있는 최하위 Task 를 모두 실적에 반영합니다. 실제 시작일: 계획시작이 기준 주차보다 앞이면 주차 시작일, 주차 안이면 계획시작일. 실제 종료일(100%): 계획종료가 기준 주차 안이면 계획종료일, 앞이면 기준일. 이미 입력된 실적일은 그대로 둡니다.">
            ⚡ 계획 → 실적 채우기
          </button>
        </div>
      </div>

      <div class="table-container wbs-scroll">
        <table id="wbsTable">
          <thead>
            <tr>
              <th class="wbs-th-w56">ID</th>
              <th class="wbs-th-w50" title="◀ 상위 레벨로 / ▶ 하위 레벨로">레벨</th>
              <th class="wbs-th-w92">서브시스템</th>
              <th class="wbs-th-min250">Task명 (Task Name)</th>
              <th class="wbs-th-w54" title="완료 / 지연 / 진행중 / 대기 (지연 기준: 프로젝트 설정 > 판정 기준)">상태</th>
              <th class="wbs-th-w50 col-fold">가중치</th>
              <th class="wbs-th-w80 col-fold">REQ ID</th>
              <th class="wbs-th-w112">계획시작</th>
              <th class="wbs-th-w112">계획종료</th>
              <th class="wbs-th-w112">실제 시작</th>
              <th class="wbs-th-w112">실제 종료</th>
              <th class="wbs-th-w48">계획%</th>
              <th class="wbs-th-w48">실적%</th>
              <th class="wbs-th-w100 col-fold" title="목록에서 고르거나 직접 입력 (1명). 상위 Task 에 지정하면 하위 Task 에도 자동 지정">담당자</th>
              <th class="wbs-th-w116 col-fold">산출물/조치</th>
              <th class="wbs-th-w136" title="⚡ 계획을 실적에 반영 · ↳ 하위 추가 · ＋ 동위 추가 · ▲▼ 순서 · × 삭제">실적·추가·순서·삭제</th>
            </tr>
          </thead>
          <tbody id="wbsTableBody"></tbody>
        </table>
      </div>
    </div>
