
    <!-- =================================================================== -->
    <!-- 5. 요구사항 관리 (tab-req) - [요건 6] 서브시스템 필터 & 리스트 선택  -->
    <!-- =================================================================== -->
    <div id="tab-req" class="tab-pane">
      <div class="sub-header-bar">
        <div class="u-flex u-ai-center u-gap-10">
          <span class="sub-title">📌 요구사항 (REQ)</span><span class="neo-ph-desc">고객이 요청한 기능을 등록하고 처리 상태를 관리합니다.</span>
          <div class="current-date-badge">기준일: <b class="lbl-current-date">2026-11-04 (수)</b></div>
        </div>
        <div class="u-flex u-gap-8 u-ai-center">
          
          <button class="btn btn-sm" data-btn="excel-down" data-click="DataIO.download" data-click-args='["req"]' title="이 화면의 서브시스템 조회 범위 그대로 엑셀로 다운로드합니다">📥 엑셀 다운로드 (요구사항)</button>
          <button class="btn btn-sm" data-btn="excel-up" data-click="DataIO.pick" data-click-args='["req"]' title="같은 양식의 엑셀을 이 화면의 서브시스템 조회 범위에 반영합니다 (반영 전 확인 · 자동 백업)">📤 엑셀 업로드 (요구사항)</button>
          <button class="btn btn-primary btn-sm" data-click="addNewReq">+ 요구사항 추가</button>
        </div>
      </div>

      <!-- 요구사항 서브시스템 필터 및 상태 통계 바 -->
      <div class="filter-toolbar">
        <div class="filter-item">
          <label class="u-bold">🗂️ 도메인별 조회:</label>
          <select class="u-bold" id="reqDomainFilter" data-change="UiH.domainFilter" data-change-args='["reqDomainFilter", "reqSubsystemFilter", "renderReqMasterTable"]'></select>
        </div>
        <div class="filter-item">
          <label class="u-bold">🏢 서브시스템별 조회:</label>
          <select id="reqSubsystemFilter" data-change="renderReqMasterTable">
            <option value="ALL">전체 서브시스템 보기</option>
          </select>
        </div>
        <div class="filter-item">
          <label class="u-bold">🏷️ 구분:</label>
          <select id="reqOriginFilter" data-change="renderReqMasterTable" title="초기 = 처음 정한 요구사항 · 추가 = VOC 에서 등록한 추가 요구사항"><option value="ALL">전체</option></select>
        </div>
        <div class="filter-item"><span class="neo-chips" id="reqStatusChips" role="group" aria-label="상태 필터"></span></div>
        <div class="filter-item u-ml-auto"><span class="list-summary" id="reqListSummary"></span></div>
      </div>

      <div class="table-container list-table-wrap">
        <table id="reqMasterTable" class="list-table">
          <thead></thead>
          <tbody id="reqMasterTableBody"></tbody>
        </table>
      </div>
    </div>
